################################################################################
# Profiles (named presets)
################################################################################

# [profiles]

################################################################################
# Projects (trust levels)
################################################################################

# 特定の worktree を trusted / untrusted としてマークします。
[projects]
# [projects."/absolute/path/to/project"]
# trust_level = "trusted"  # または "untrusted"

[projects."/home/zanth/repos/myproj"]
trust_level = "trusted"

[projects."/workspace"]
trust_level = "trusted"

[projects."/home/zanth/repos/tdx/tdx"]
trust_level = "trusted"

################################################################################
# OpenTelemetry (OTEL) - disabled by default
################################################################################

# [otel]
# ログにユーザープロンプト本文を含めます。既定: false
# log_user_prompt = false
# テレメトリに付与する環境ラベル。既定: "dev"
# environment = "dev"
# エクスポーター: none（既定） | otlp-http | otlp-grpc
# exporter = "none"
# トレースエクスポーター: none（既定） | otlp-http | otlp-grpc
# trace_exporter = "none"

# 例: OTLP/HTTP エクスポーター設定
# [otel.exporter."otlp-http"]
# endpoint = "https://otel.example.com/v1/logs"
# protocol = "binary"                         # "binary" | "json"

# [otel.exporter."otlp-http".headers]
# "x-otlp-api-key" = "${OTLP_TOKEN}"

# 例: OTLP/gRPC エクスポーター設定
# [otel.exporter."otlp-grpc"]
# endpoint = "https://otel.example.com:4317",
# headers = { "x-otlp-meta" = "abc123" }

# 例: 相互 TLS を用いた OTLP エクスポーター
# [otel.exporter."otlp-http"]
# endpoint = "https://otel.example.com/v1/logs"
# protocol = "binary"

# [otel.exporter."otlp-http".headers]
# "x-otlp-api-key" = "${OTLP_TOKEN}"

# [otel.exporter."otlp-http".tls]
# ca-certificate = "certs/otel-ca.pem"
# client-certificate = "/etc/codex/certs/client.pem"
# client-private-key = "/etc/codex/certs/client-key.pem"
# client-private-key = "/etc/codex/certs/client-key.pem"
