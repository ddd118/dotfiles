---
- name: Linux environment setup
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    # is_wsl / is_container は group_vars/all.yml 側で自動判定する

    - name: Verify supported OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: |
          この playbook は現状 Debian/Ubuntu 系 (apt) を対象にしています。
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
      tags: [always]

    - name: Verify not running as root
      ansible.builtin.assert:
        that:
          # Dev Container などで root ユーザーが使われるケースがあるため、
          # "コンテナ内" では例外的に許可する。
          - ansible_user_id != 'root' or (allow_root | default(false) | bool) or (is_container | bool)
        fail_msg: |
          root では実行しないでください。通常ユーザーで実行してください。

          例外:
            - Dev Container 等で root ユーザーしか存在しない場合は許可します。
            - どうしても root で回したい場合は "-e allow_root=true" を指定してください。
      tags: [always]

    - name: Display environment info
      ansible.builtin.debug:
        msg: |
          環境: {{ 'WSL' if is_wsl else ('コンテナ' if is_container else 'ネイティブ Linux') }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Codename: {{ ansible_distribution_release }}
      tags: [always]

  roles:
    - role: packages
      tags: [packages]
    - role: stow
      tags: [stow]
    - role: fonts
      tags: [fonts]
      when: install_fonts | bool
    - role: mise
      tags: [mise]
      when: install_mise | bool
    - role: curl_tools
      tags: [curl_tools]
    - role: shell
      tags: [shell]
    - role: textlint
      tags: [textlint]
    - role: yazi
      tags: [yazi]
    - role: docker
      tags: [docker]
      when: install_docker | bool
    - role: gui_apps
      tags: [gui_apps]
      when: install_gui_apps | bool
    - role: systemd
      tags: [systemd]
      when: not (is_container | bool)

  post_tasks:
    - name: Change default shell to zsh
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh
      become: true
      when: set_zsh_default | bool
      tags: [shell]

    - name: Display manual download URLs
      ansible.builtin.debug:
        msg: |
          === 手動ダウンロードが必要なもの ===
          - Cursor: https://cursor.com/ja/download
      tags: [always]

    - name: Setup complete
      ansible.builtin.debug:
        msg: |
          セットアップ完了!
          - zshrc 反映: exec zsh
          - docker グループ反映: ログアウト/再ログイン
      tags: [always]
