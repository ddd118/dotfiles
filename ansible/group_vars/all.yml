# ==================================================
# 環境検出（自動設定 - 書き換え不要）
# ==================================================
is_wsl: >-
  {{
    ansible_env.WSL_DISTRO_NAME is defined or
    (lookup('file', '/proc/version', errors='ignore') | default('') is regex('(?i)microsoft'))
  }}

# Docker / Dev Container など "コンテナ内" 判定
# - Dev Container では systemd が無い/動かないケースが多く、
#   docker/systemd/gui 系のセットアップが失敗しやすいので、
#   後続の optional フラグのデフォルト値を切り替えるために使う。
is_container: >-
  {{
    (lookup('file', '/.dockerenv', errors='ignore') | default('') | length > 0) or
    (lookup('file', '/run/.containerenv', errors='ignore') | default('') | length > 0) or
    (ansible_virtualization_type | default('')) in ['docker', 'containerd', 'podman', 'lxc', 'systemd-nspawn'] or
    ansible_env.REMOTE_CONTAINERS is defined or
    ansible_env.DEVCONTAINER is defined or
    ansible_env.CODESPACES is defined
  }}

# ==================================================
# オプショナルコンポーネント
# コマンドラインで上書き可: -e "install_docker=false"
# ==================================================
allow_root: false

install_docker: "{{ not is_container }}"
install_gui_apps: "{{ (not is_wsl) and (not is_container) }}"
install_fonts: "{{ (not is_wsl) and (not is_container) }}"
install_mise: true
install_vscode: "{{ install_gui_apps }}"
install_cursor: "{{ install_gui_apps }}"
install_antigravity: "{{ install_gui_apps }}"
set_zsh_default: false

# WSL 上で systemd --user を使ってサービスを enable するか。
# - 個人用途のサービスが含まれることが多いため、環境に合わせて OFF にできます。
enable_wsl_user_services: true

# ランタイム/CLI は mise で一元管理する。
mise_runtime_versions:
  - name: python
    version: "latest"
  - name: go
    version: "latest"
  - name: ruby
    version: "latest"
  - name: node
    version: "latest"
  - name: npm
    version: "latest"
  - name: pnpm
    version: "latest"
  - name: uv
    version: "latest"
  - name: claude
    version: "latest"
  - name: codex
    version: "latest"
  - name: devcontainer-cli
    version: "latest"
  - name: gemini
    version: "latest"
  - name: "npm:@vscode/vsce"
    version: "latest"
  - name: dotnet
    version: "latest"
  - name: rust
    version: "latest"
  - name: yazi
    version: "latest"

# ==================================================
# リポジトリパス
# ==================================================
settings_repo: "{{ playbook_dir | dirname }}"
