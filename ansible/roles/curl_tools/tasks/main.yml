---
# --- Claude Code ---
- name: Check if Claude Code is installed
  ansible.builtin.command: bash -lc "command -v claude"
  register: claude_check
  changed_when: false
  failed_when: false

- name: Install Claude Code via native installer
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  when:
    - claude_check.rc != 0
    - not ansible_check_mode

# --- Codex CLI ---
- name: Check if Codex CLI is installed
  ansible.builtin.command: bash -lc "command -v codex"
  register: codex_check
  changed_when: false
  failed_when: false

- name: Install Codex CLI via standalone installer
  ansible.builtin.shell: curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
  when:
    - codex_check.rc != 0
    - not ansible_check_mode

# --- vim-plug ---
- name: Check vim autoload directory
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.vim/autoload"
  register: vim_autoload_dir

- name: Ensure vim autoload directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.vim/autoload"
    state: directory
    mode: "0755"

- name: Install vim-plug
  ansible.builtin.get_url:
    url: "{{ vim_plug_url }}"
    dest: "{{ ansible_env.HOME }}/.vim/autoload/plug.vim"
    mode: "0644"
  when: (not ansible_check_mode) or (vim_autoload_dir.stat.exists | default(false))
