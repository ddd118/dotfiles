---
- name: Resolve stow package groups
  ansible.builtin.set_fact:
    stow_file_packages_effective: >-
      {{
        (stow_file_packages | default(stow_packages | default([])))
        | reject('equalto', 'config-systemd-user')
        | list
        if not (is_wsl | default(false) | bool)
        else (stow_file_packages | default(stow_packages | default([])))
      }}
    stow_dir_packages_effective: "{{ stow_dir_packages | default([]) }}"
    stow_dir_bind_targets_effective: "{{ stow_dir_bind_targets | default([]) }}"
  changed_when: false

- name: Validate dir bind target definitions
  ansible.builtin.assert:
    that:
      - >-
        (stow_dir_packages_effective | difference((stow_dir_bind_targets_effective | default([])) | map(attribute='package') | list) | length) == 0
    fail_msg: >-
      stow_dir_packages に含まれる package すべてへ stow_dir_bind_targets を定義してください。
  when: stow_dir_packages_effective | length > 0

- name: Include stow file-mode setup
  ansible.builtin.include_tasks: file_mode.yml
  when: stow_file_packages_effective | length > 0

- name: Include stow dir-mode setup
  ansible.builtin.include_tasks: dir_mode.yml
  when: stow_dir_packages_effective | length > 0

- name: Ensure .ssh/conf.local exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Ensure .ssh/conf.local exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh/conf.local"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Check if devcontainer-specific mise config exists
  ansible.builtin.stat:
    path: "{{ mise_devcontainer_config_source_path }}"
  register: mise_devcontainer_config_stat
  changed_when: false
  when: settings_container_context | bool

- name: Validate devcontainer-specific mise config
  ansible.builtin.assert:
    that:
      - mise_devcontainer_config_stat.stat.exists
      - mise_devcontainer_config_stat.stat.isreg | default(false)
    fail_msg: >-
      dotfiles Dev Container 用の mise 設定が見つかりません:
      {{ mise_devcontainer_config_source_path }}
  when: settings_container_context | bool

- name: Replace mise global config with devcontainer profile
  ansible.builtin.file:
    path: "{{ mise_global_config_path }}"
    state: absent
  when: settings_container_context | bool

- name: Install devcontainer-specific mise config
  ansible.builtin.copy:
    src: "{{ mise_devcontainer_config_source_path }}"
    dest: "{{ mise_global_config_path }}"
    mode: "0644"
  when: settings_container_context | bool
