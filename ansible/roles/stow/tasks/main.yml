---
- name: Deploy stow packages
  ansible.builtin.command:
    cmd: stow --no-folding -d {{ settings_repo }}/stow -t {{ ansible_env.HOME }} {{ stow_packages | join(' ') }}
  register: stow_result
  changed_when: (stow_result.stdout is search('LINK:')) or (stow_result.stderr is search('LINK:'))
  failed_when: stow_result.rc != 0

- name: Ensure .ssh/conf.local exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Ensure .ssh/conf.local exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh/conf.local"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
