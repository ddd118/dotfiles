---
- name: Find managed file entries in stow file-mode packages
  ansible.builtin.find:
    paths: "{{ settings_repo }}/stow/{{ item }}"
    recurse: true
    hidden: true
    file_type: file
  loop: "{{ stow_file_packages_effective }}"
  register: stow_file_mode_files
  changed_when: false

- name: Find managed symlink entries in stow file-mode packages
  ansible.builtin.find:
    paths: "{{ settings_repo }}/stow/{{ item }}"
    recurse: true
    hidden: true
    file_type: link
  loop: "{{ stow_file_packages_effective }}"
  register: stow_file_mode_links
  changed_when: false

- name: Build managed target entries for file mode
  # file モードは「管理対象ファイル/リンクだけ」を安全に置き換える。
  ansible.builtin.set_fact:
    stow_file_mode_targets: >-
      {%- set targets = [] -%}
      {%- for result in ((stow_file_mode_files.results | default([])) + (stow_file_mode_links.results | default([]))) -%}
        {%- for entry in (result.files | default([])) -%}
          {%- set rel_path = entry.path | regex_replace('^' ~ (settings_repo ~ '/stow/' ~ result.item ~ '/'), '') -%}
          {%- set _ = targets.append({'target_rel_path': rel_path, 'source_path': entry.path}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ targets }}
  changed_when: false

- name: Stat managed target paths in HOME for file mode
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/{{ item.target_rel_path }}"
    follow: false
  loop: "{{ stow_file_mode_targets }}"
  register: stow_file_mode_target_stats
  changed_when: false

- name: Classify removable targets for file mode
  ansible.builtin.set_fact:
    stow_file_mode_removable_targets: >-
      {%- set removable = [] -%}
      {%- for result in (stow_file_mode_target_stats.results | default([])) -%}
        {%- set is_file = result.stat.isreg | default(false) -%}
        {%- set is_link = result.stat.islnk | default(false) -%}
        {%- set target_parent = ansible_env.HOME ~ '/' ~ (result.item.target_rel_path | dirname) -%}
        {%- set expected_source = result.item.source_path | relpath(target_parent) -%}
        {%- if is_file -%}
          {%- set _ = removable.append(result.item.target_rel_path) -%}
        {%- elif is_link and ((result.stat.lnk_source | default('')) != expected_source) -%}
          {%- set _ = removable.append(result.item.target_rel_path) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ removable | unique | list }}
  changed_when: false

- name: Classify blocking targets for file mode
  ansible.builtin.set_fact:
    stow_file_mode_blocking_targets: >-
      {%- set blocking = [] -%}
      {%- for result in (stow_file_mode_target_stats.results | default([])) -%}
        {%- set is_file = result.stat.isreg | default(false) -%}
        {%- set is_link = result.stat.islnk | default(false) -%}
        {%- if (result.stat.exists | default(false)) and (not is_file) and (not is_link) -%}
          {%- set detected_type = 'other' -%}
          {%- if result.stat.isdir | default(false) -%}
            {%- set detected_type = 'directory' -%}
          {%- elif result.stat.ischr | default(false) -%}
            {%- set detected_type = 'char_device' -%}
          {%- elif result.stat.isblk | default(false) -%}
            {%- set detected_type = 'block_device' -%}
          {%- elif result.stat.issock | default(false) -%}
            {%- set detected_type = 'socket' -%}
          {%- elif result.stat.isfifo | default(false) -%}
            {%- set detected_type = 'fifo' -%}
          {%- endif -%}
          {%- set _ = blocking.append({'path': result.item.target_rel_path, 'type': detected_type}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ blocking }}
  changed_when: false

- name: Fail on blocking targets for file mode
  ansible.builtin.fail:
    msg: |-
      stow file モードで型不一致の既存パスが見つかりました。安全のため処理を停止します。
      既存パス（path: type）:
      {% for item in stow_file_mode_blocking_targets %}
      - {{ item.path }}: {{ item.type }}
      {% endfor %}
  when: stow_file_mode_blocking_targets | length > 0

- name: Remove managed file/link targets for file mode
  # 既存ディレクトリは削除せず、管理対象ファイル/不一致シンボリックリンクのみ置き換える。
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: absent
  loop: "{{ stow_file_mode_removable_targets }}"
  when: stow_file_mode_removable_targets | length > 0

- name: Deploy stow file-mode packages
  ansible.builtin.command:
    cmd: >-
      stow --no-folding --restow -v
      -d {{ settings_repo }}/stow
      -t {{ ansible_env.HOME }}
      {{ stow_file_packages_effective | join(' ') }}
  register: stow_file_mode_result
  changed_when: >-
    (stow_file_mode_result.stdout is search('LINK:'))
    or (stow_file_mode_result.stderr is search('LINK:'))
    or (stow_file_mode_result.stdout is search('UNLINK:'))
    or (stow_file_mode_result.stderr is search('UNLINK:'))
    or (stow_file_mode_result.stdout is search('MKDIR:'))
    or (stow_file_mode_result.stderr is search('MKDIR:'))
  failed_when: stow_file_mode_result.rc != 0
