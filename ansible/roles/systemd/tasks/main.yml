---
- name: Create systemd user directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: Enable systemd user services (WSL)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    scope: user
  loop: "{{ systemd_wsl_services }}"
  when: is_wsl | bool
  failed_when: false
