---
- name: Check if mise is installed
  ansible.builtin.stat:
    path: "{{ mise_bin }}"
  register: mise_stat

- name: Install mise
  ansible.builtin.shell: curl https://mise.run | sh
  args:
    creates: "{{ mise_bin }}"
  when:
    - not ansible_check_mode
    - not mise_stat.stat.exists

- name: Check if mise global config exists
  ansible.builtin.stat:
    path: "{{ mise_global_config_path }}"
  register: mise_global_config_stat

- name: Ensure mise global config is managed by stow
  ansible.builtin.assert:
    that:
      - mise_global_config_stat.stat.exists
      - (mise_global_config_stat.stat.isreg | default(false)) or (mise_global_config_stat.stat.islnk | default(false))
    fail_msg: |
      {{ mise_global_config_path }} が見つかりません。
      stow で .config/mise/config.toml を配置してから再実行してください。
      例: ansible-playbook ansible/site.yml --tags stow,mise

- name: Prefer precompiled Ruby binaries on mise
  ansible.builtin.command: "{{ mise_bin }} settings ruby.compile=false"
  environment: "{{ mise_env }}"
  changed_when: false
  when:
    - (not ansible_check_mode) or mise_stat.stat.exists
    - mise_global_config_stat.stat.exists

- name: Install configured tools with mise config
  ansible.builtin.command: "{{ mise_bin }} install"
  args:
    chdir: "{{ ansible_env.HOME }}"
  environment: "{{ mise_env }}"
  changed_when: false
  when:
    - (not ansible_check_mode) or mise_stat.stat.exists
    - mise_global_config_stat.stat.exists
