---
- name: Check if Volta is installed
  ansible.builtin.stat:
    path: "{{ volta_bin }}"
  register: volta_stat

- name: Install Volta
  ansible.builtin.shell: curl -fsSL https://get.volta.sh | bash -s -- --skip-setup
  args:
    creates: "{{ volta_bin }}"
  when: not volta_stat.stat.exists

- name: Install Node LTS via Volta
  ansible.builtin.command: "{{ volta_bin }} install node@lts"
  environment: "{{ volta_env }}"
  register: volta_node
  changed_when: "'installed' in volta_node.stdout"

- name: Install npm via Volta
  ansible.builtin.command: "{{ volta_bin }} install npm@latest"
  environment: "{{ volta_env }}"
  register: volta_npm
  changed_when: "'installed' in volta_npm.stdout"

- name: Install pnpm via Volta
  ansible.builtin.command: "{{ volta_bin }} install pnpm@latest"
  environment: "{{ volta_env }}"
  register: volta_pnpm
  changed_when: "'installed' in volta_pnpm.stdout"

- name: Install global Node tools
  ansible.builtin.command: "{{ volta_bin }} install {{ item }}"
  environment: "{{ volta_env }}"
  loop: "{{ node_global_tools }}"
  register: volta_tool
  changed_when: "'installed' in volta_tool.stdout"
