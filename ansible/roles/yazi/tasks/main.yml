---
- name: Check if yazi is installed
  ansible.builtin.command: which yazi
  register: yazi_check
  changed_when: false
  failed_when: false

- name: Install yazi from source
  when: yazi_check.rc != 0
  block:
    - name: Check if cargo is available
      ansible.builtin.command: which cargo
      register: cargo_check
      changed_when: false
      failed_when: false

    - name: Install rustup
      ansible.builtin.shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo"
      when: cargo_check.rc != 0

    - name: Clone yazi repository
      ansible.builtin.git:
        repo: https://github.com/sxyazi/yazi.git
        dest: "{{ yazi_build_dir }}"
        version: "{{ yazi_version }}"

    - name: Build yazi with cargo
      ansible.builtin.command:
        cmd: "{{ ansible_env.HOME }}/.cargo/bin/cargo install --path yazi-fm --locked"
        chdir: "{{ yazi_build_dir }}"
      environment:
        PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"

- name: Check if ya command is available
  # yazi のインストール方法によっては "ya" が ~/.cargo/bin に存在しないことがある。
  # その場合は plugin の追加をスキップする。
  ansible.builtin.command: "{{ ansible_env.HOME }}/.cargo/bin/ya --version"
  register: ya_check
  changed_when: false
  failed_when: false

- name: Install yazi plugins
  ansible.builtin.command:
    cmd: "{{ ansible_env.HOME }}/.cargo/bin/ya pkg add {{ item }}"
  loop: "{{ yazi_plugins }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
  register: ya_pkg
  # ya pkg add は "already installed" を stderr に出すことがあるが、
  # ループ + register の場合、changed 判定を精緻にするより "常に変更なし" として扱う。
  changed_when: false
  failed_when: false
  when: ya_check.rc == 0

- name: Explain why yazi plugin installation is skipped
  ansible.builtin.debug:
    msg: |
      "ya" コマンドが見つからないため yazi plugin の追加をスキップします。
      (yazi を apt/snap/binary で入れている場合など)
  when:
    - ya_check.rc != 0
    - yazi_plugins | length > 0
