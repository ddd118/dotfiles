---
- name: Check if yazi is available
  ansible.builtin.command: bash -lc "command -v yazi"
  register: yazi_check
  changed_when: false
  failed_when: false
  environment: "{{ yazi_env }}"

- name: Check if ya command is available
  ansible.builtin.command: bash -lc "command -v ya"
  register: ya_check
  changed_when: false
  failed_when: false
  environment: "{{ yazi_env }}"

- name: Install yazi flavors
  ansible.builtin.command:
    cmd: ya pkg add {{ item }}
  loop: "{{ yazi_flavors }}"
  environment: "{{ yazi_env }}"
  register: ya_flavor_pkg
  changed_when: false
  failed_when: false
  when:
    - yazi_check.rc == 0
    - ya_check.rc == 0

- name: Explain why yazi flavor installation is skipped
  ansible.builtin.debug:
    msg: |
      yazi または ya コマンドが見つからないため yazi flavor の追加をスキップします。
      yazi 本体を先に導入してから再実行してください。
  when:
    - yazi_check.rc != 0 or ya_check.rc != 0
    - yazi_flavors | length > 0
