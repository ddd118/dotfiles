---
- name: Check if yazi is available from mise shims
  ansible.builtin.command: bash -lc "command -v yazi"
  register: yazi_check
  changed_when: false
  failed_when: false
  environment: "{{ yazi_env }}"

- name: Check if ya command is available from mise shims
  ansible.builtin.command: bash -lc "command -v ya"
  register: ya_check
  changed_when: false
  failed_when: false
  environment: "{{ yazi_env }}"

- name: Install yazi plugins
  ansible.builtin.command:
    cmd: ya pkg add {{ item }}
  loop: "{{ yazi_plugins }}"
  environment: "{{ yazi_env }}"
  register: ya_pkg
  changed_when: false
  failed_when: false
  when:
    - yazi_check.rc == 0
    - ya_check.rc == 0

- name: Explain why yazi plugin installation is skipped
  ansible.builtin.debug:
    msg: |
      yazi/ya が見つからないため yazi plugin の追加をスキップします。
      mise の runtime 設定に yazi を含めてください。
  when:
    - yazi_check.rc != 0 or ya_check.rc != 0
    - yazi_plugins | length > 0
