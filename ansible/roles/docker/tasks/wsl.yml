---
- name: Check Docker socket (WSL)
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_sock

- name: Display Docker Desktop info
  ansible.builtin.debug:
    msg: >-
      WSL環境です。Docker Desktop の WSL Integration を有効にしてください。
      ソケット検出: {{ 'あり' if docker_sock.stat.exists else 'なし' }}
