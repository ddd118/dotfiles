---
- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"

- name: Ensure git-gtr source directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/git-worktree-runner"
    state: directory
    mode: "0755"

- name: Clone or update git-worktree-runner
  ansible.builtin.git:
    repo: https://github.com/coderabbitai/git-worktree-runner.git
    dest: "{{ ansible_env.HOME }}/.local/share/git-worktree-runner"
    version: main
    update: true
    depth: 1

- name: Install or update git-gtr via upstream install script
  ansible.builtin.shell: |
    set -euo pipefail
    FILTERED_PATH="$(printf '%s\n' "$PATH" | tr ':' '\n' | awk '$0 != "/usr/local/bin"' | paste -sd ':' -)"
    PATH="$FILTERED_PATH" ./install.sh
  args:
    chdir: "{{ ansible_env.HOME }}/.local/share/git-worktree-runner"
    executable: /bin/bash
  register: git_gtr_install
  changed_when: "'already installed' not in (git_gtr_install.stdout | lower)"
