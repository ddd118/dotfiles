---
- name: Check if git-gtr is installed
  ansible.builtin.command: which git-gtr
  register: git_gtr_check
  changed_when: false
  failed_when: false

- name: Clone and install git-gtr
  when: git_gtr_check.rc != 0
  block:
    - name: Clone git-worktree-runner
      ansible.builtin.git:
        repo: https://github.com/coderabbitai/git-worktree-runner.git
        dest: /tmp/git-worktree-runner
        depth: 1

    - name: Run git-gtr install script
      ansible.builtin.command:
        cmd: ./install.sh
        chdir: /tmp/git-worktree-runner

    - name: Clean up git-worktree-runner
      ansible.builtin.file:
        path: /tmp/git-worktree-runner
        state: absent

- name: Ensure completions directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.zsh/completions"
    state: directory
    mode: "0755"

- name: Download git-gtr completion
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/coderabbitai/git-worktree-runner/main/completions/_git-gtr
    dest: "{{ ansible_env.HOME }}/.zsh/completions/_git-gtr"
    mode: "0644"
