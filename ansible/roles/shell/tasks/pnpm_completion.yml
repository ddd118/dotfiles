---
- name: Check if pnpm is available from mise shims
  ansible.builtin.command: bash -lc "command -v pnpm"
  register: pnpm_bin
  changed_when: false
  failed_when: false
  environment: "{{ shell_mise_env }}"

- name: Ensure completions directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.zsh/completions"
    state: directory
    mode: "0755"
  when: pnpm_bin.rc == 0

- name: Check existing pnpm completion file
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.zsh/completions/_pnpm"
  register: pnpm_completion_file
  when: pnpm_bin.rc == 0

- name: Generate pnpm completion script
  ansible.builtin.command: pnpm completion zsh
  register: pnpm_completion
  changed_when: false
  environment: "{{ shell_mise_env }}"
  when:
    - pnpm_bin.rc == 0
    - not ansible_check_mode

- name: Install pnpm completion script
  ansible.builtin.copy:
    content: "{{ pnpm_completion.stdout }}"
    dest: "{{ ansible_env.HOME }}/.zsh/completions/_pnpm"
    mode: "0644"
  when:
    - pnpm_bin.rc == 0
    - (not ansible_check_mode) or (pnpm_completion_file.stat.exists | default(false))
