---
- name: Ensure font directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ plemoljp_cache_dir }}"
    - "{{ plemoljp_extract_dir }}"
    - "{{ plemoljp_install_dir }}"
  when: install_plemoljp | bool

- name: Install PlemolJP fonts
  when:
    - install_plemoljp | bool
    - not ansible_check_mode
  block:
    - name: Resolve latest PlemolJP release tag
      ansible.builtin.uri:
        url: "{{ plemoljp_release_latest_url }}"
        method: GET
        follow_redirects: none
        status_code: [301, 302, 307, 308]
      register: plemoljp_latest_redirect

    - name: Build PlemolJP release metadata
      ansible.builtin.set_fact:
        plemoljp_release_tag: "{{ plemoljp_latest_redirect.location | regex_replace('.*/tag/', '') }}"
        plemoljp_asset_prefix: "{{ plemoljp_asset_filename_prefix_map[plemoljp_variant] | default(plemoljp_asset_filename_prefix_map.normal) }}"
        plemoljp_release_version: "{{ plemoljp_latest_redirect.location | regex_replace('.*/tag/', '') | regex_replace('^v', '') }}"

    - name: Build PlemolJP asset metadata
      ansible.builtin.set_fact:
        plemoljp_asset_name: >-
          {{
            plemoljp_asset_prefix
            ~ plemoljp_release_version
            ~ '.zip'
          }}

    - name: Build PlemolJP archive URL
      ansible.builtin.set_fact:
        plemoljp_asset_download_url: >-
          {{
            'https://github.com/yuru7/PlemolJP/releases/download/'
            ~ plemoljp_release_tag
            ~ '/'
            ~ plemoljp_asset_name
          }}

    - name: Download PlemolJP release archive
      ansible.builtin.get_url:
        url: "{{ plemoljp_asset_download_url }}"
        dest: "{{ plemoljp_cache_dir }}/{{ plemoljp_asset_name }}"
        mode: "0644"

    - name: Extract PlemolJP release archive
      ansible.builtin.unarchive:
        src: "{{ plemoljp_cache_dir }}/{{ plemoljp_asset_name }}"
        dest: "{{ plemoljp_extract_dir }}"
        remote_src: true

    - name: Find installable font files
      ansible.builtin.find:
        paths: "{{ plemoljp_extract_dir }}"
        patterns:
          - "*.ttf"
          - "*.otf"
        recurse: true
      register: plemoljp_font_files

    - name: Install PlemolJP font files
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ plemoljp_install_dir }}/{{ item.path | basename }}"
        mode: "0644"
        remote_src: true
      loop: "{{ plemoljp_font_files.files | default([]) }}"
      when: (plemoljp_font_files.matched | default(0)) > 0

    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f "{{ ansible_env.HOME }}/.local/share/fonts"
      changed_when: false
