---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name: >-
      {{
        (apt_base_packages + apt_additional_packages)
        | difference(apt_container_exclude_packages if (is_container | default(false) | bool) else [])
        | difference(
            apt_wsl_without_systemd_exclude_packages
            if (
              (is_wsl | default(false) | bool) and
              ((ansible_service_mgr | default('')) != 'systemd')
            ) else []
          )
      }}
    state: present
  become: true

- name: Install Ubuntu-only packages
  ansible.builtin.apt:
    name: "{{ apt_ubuntu_only_packages }}"
    state: present
  become: true
  when:
    - apt_ubuntu_only_packages is defined
    - ansible_distribution in ['Ubuntu', 'Linux Mint']
