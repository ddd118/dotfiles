apt_base_packages:
  - ca-certificates
  - curl
  - wget
  - gnupg
  - lsb-release
  - software-properties-common
  - apt-transport-https
  - git
  - zsh
  - unzip
  - less
  - xdg-utils
  - fzf
  - zoxide
  - bat
  - xclip
  # locale の生成/設定に必要 (特に Debian/最小コンテナ)
  - locales
  - python3
  # Ansible apt モジュールが python3-apt を要求することがある
  - python3-apt
  - python3-pip

apt_additional_packages:
  - autossh
  - jq
  - ripgrep
  - shellcheck
  - shfmt
  - inotify-tools
  - openssh-server
  - peco
  - poppler-utils
  - python3-venv
  # Rust 製ツールをソースからビルドする際に必要 (例: yazi)
  - build-essential
  - pkg-config
  - zip
  - stow

# Ubuntu のみ存在する/依存関係が異なるパッケージ
apt_ubuntu_only_packages:
  # Ubuntu の翻訳パック。Debian には "language-pack-*" が無い。
  - language-pack-ja

# コンテナでは不要/邪魔になりがちなパッケージを除外する。
# (例: openssh-server は service 起動が絡んで失敗要因になりやすい)
apt_container_exclude_packages:
  - openssh-server

# WSL で systemd が有効でない場合に除外するパッケージ。
# - openssh-server は postinst で systemctl 実行が走り失敗しやすい。
apt_wsl_without_systemd_exclude_packages:
  - openssh-server
