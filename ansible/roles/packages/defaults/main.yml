apt_base_packages:
  - ca-certificates
  - curl
  - wget
  - gnupg
  - git
  # flock コマンドを提供する
  - util-linux
  - zsh
  - unzip
  - less
  - xdg-utils
  - fzf
  - zoxide
  - bat
  - xclip
  # locale の生成/設定に必要 (特に Debian/最小コンテナ)
  - locales
  # Ansible apt モジュールが python3-apt を要求することがある
  - python3-apt

apt_additional_packages:
  - autossh
  - gh
  - jq
  - ripgrep
  - shellcheck
  - shfmt
  - inotify-tools
  - openssh-server
  - peco
  - poppler-utils
  - todotxt-cli
  - zip
  - stow

# Ubuntu のみ存在する/依存関係が異なるパッケージ
apt_ubuntu_only_packages:
  # Ubuntu の翻訳パック。Debian には "language-pack-*" が無い。
  - language-pack-ja

# コンテナでは不要/邪魔になりがちなパッケージを除外する。
# (例: openssh-server は service 起動が絡んで失敗要因になりやすい)
apt_container_exclude_packages:
  - openssh-server

# WSL では除外するパッケージ。
# - systemd 有効時でも openssh-server の postinst が失敗する事例があるため、
#   WSL では既定で除外する（必要なら変数上書きで個別に有効化）。
apt_wsl_without_systemd_exclude_packages:
  - openssh-server
